; Waveshare ESP32-C6-Touch-LCD-1.47
; JD9853 172x320 touch IPS + QMI8658A + AXS5106L + TF + charge
; Docs: https://docs.waveshare.com/ESP32-C6-Touch-LCD-1.47
; Display: Arduino_GFX + JD9853 init (NOT TFT_eSPI / NOT plain ST7789)

[env:esp32-c6-touch-lcd-147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 8MB
board_build.flash_size = 8MB

lib_deps =
  moononournation/GFX Library for Arduino @ ^1.5.9
  bblanchon/ArduinoJson @ ^7.3.0

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I include
